<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490">
  <foreignObject width="900" height="490">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --paper: #ECEEF3; --ink: #14121C; --violet: #7B5CF5; --muted: #5D5A6B;
          --serif: Georgia, 'Times New Roman', serif;
          --sans: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
          --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
        .page {
          width: 900px; height: 490px; border-radius: 18px; overflow: hidden;
          background:
            radial-gradient(circle at 1px 1px, rgba(20,18,28,.07) 1px, transparent 0) 0 0 / 6px 6px,
            var(--paper);
          color: var(--ink); font-family: var(--sans); padding: 34px 44px;
        }

        .head {
          display: flex; align-items: flex-end; gap: 18px;
          border-bottom: 2px solid var(--ink); padding-bottom: 14px;
          animation: fade .8s ease both;
        }
        .num { font: 700 64px/0.8 var(--serif); color: var(--violet); letter-spacing: -0.04em; }
        .kicker { font: 700 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
        .title { font: 700 32px/1.1 var(--serif); letter-spacing: -0.015em; }
        .pg { margin-left: auto; font: 600 11px var(--mono); letter-spacing: .18em; }

        .body { display: flex; gap: 40px; padding: 26px 0 24px; }
        .quote {
          flex: 1.05; position: relative; padding-top: 30px;
          font: italic 400 28px/1.28 var(--serif); letter-spacing: -0.01em;
          animation: slide .9s .2s cubic-bezier(.2,.8,.2,1) both;
        }
        .quote::before {
          content: '\201C'; position: absolute; top: -26px; left: -6px;
          font: 700 110px/1 var(--serif); color: var(--violet);
        }
        .quote em { font-style: normal; background: linear-gradient(transparent 62%, rgba(123,92,245,.35) 0); }

        .text {
          flex: 1; font-size: 15px; line-height: 1.65; color: #2A2735;
          border-left: 1px solid rgba(20,18,28,.25); padding-left: 28px;
          animation: fade 1s .4s ease both;
        }
        .text p + p { margin-top: 12px; }
        .text p:first-child::first-letter {
          float: left; font: 700 58px/0.82 var(--serif); color: var(--violet);
          margin: 6px 8px 0 0;
        }
        .text b { color: var(--ink); }

        .sheet-title {
          font: 700 11px var(--mono); letter-spacing: .24em; text-transform: uppercase;
          margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
        }
        .sheet-title::after { content: ''; flex: 1; height: 1px; background: var(--ink); }
        .sheet {
          display: grid; grid-template-columns: repeat(3, 1fr);
          border-top: 2px solid var(--ink); border-left: 1px solid var(--ink);
        }
        .cell {
          border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
          padding: 10px 14px; animation: fade .6s ease both;
        }
        .cell:nth-child(1) { animation-delay: .6s; }  .cell:nth-child(2) { animation-delay: .7s; }
        .cell:nth-child(3) { animation-delay: .8s; }  .cell:nth-child(4) { animation-delay: .9s; }
        .cell:nth-child(5) { animation-delay: 1s; }   .cell:nth-child(6) { animation-delay: 1.1s; }
        .cell small { display: block; font: 700 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--violet); }
        .cell span { font: 600 14.5px var(--sans); }

        @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slide { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      </style>

      <div class="head">
        <div class="num">01</div>
        <div>
          <div class="kicker">Manifesto</div>
          <div class="title">Quem assina esta edição</div>
        </div>
        <div class="pg">P. 02</div>
      </div>

      <div class="body">
        <div class="quote">
          Gosto de construir interfaces onde <em>código, design e experiência do usuário</em> trabalham juntos.
        </div>
        <div class="text">
          <p>Meu foco está no ecossistema <b>JavaScript/TypeScript</b>, criando experiências para <b>web e mobile</b>.</p>
          <p>Busco evoluir não apenas o código, mas a forma como as pessoas interagem com o que construo — cada detalhe de interface é uma decisão.</p>
        </div>
      </div>

      <div class="sheet-title">Ficha técnica</div>
      <div class="sheet">
        <div class="cell"><small>Base</small><span>Conquista, MG · Brasil</span></div>
        <div class="cell"><small>Formação</small><span>Sistemas de Informação</span></div>
        <div class="cell"><small>Agora</small><span>Mergulhando no ecossistema React</span></div>
        <div class="cell"><small>Front-end</small><span>React · Next.js · TypeScript</span></div>
        <div class="cell"><small>Mobile</small><span>React Native</span></div>
        <div class="cell"><small>Interesses</small><span>UX/UI · Performance · Tech · Games</span></div>
      </div>
    </div>
  </foreignObject>
</svg>
